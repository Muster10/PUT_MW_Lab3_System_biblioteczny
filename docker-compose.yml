services:
  database:
    image: alpine
    container_name: biblioteka_baza
    volumes:
      - ./database:/dane_json
    command: tail -f /dev/null
    healthcheck:
      test: ["CMD", "ls", "/dane_json"]
      interval: 2s
  
  backend:
    build: ./backend
    container_name: biblioteka_backend
    volumes:
      - ./database:/app/database
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 5s
  
  frontend:
    build: ./frontend
    container_name: biblioteka_frontend
    ports:
      - "80:80"
    depends_on:
      - backend