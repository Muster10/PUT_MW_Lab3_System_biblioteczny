services:
  database:
    image: postgres:16-alpine
    container_name: biblioteka_baza
    environment:
      POSTGRES_USER: biblioteka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biblioteka_dev_pass}
      POSTGRES_DB: biblioteka
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - biblioteka_net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "biblioteka"]
      interval: 2s
  
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://biblioteka:${POSTGRES_PASSWORD:-biblioteka_dev_pass}@database:5432/biblioteka
    depends_on:
      database:
        condition: service_healthy
    networks:
      - biblioteka_net
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 5s
  
  frontend:
    build: ./frontend
    container_name: biblioteka_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - biblioteka_net

  prometheus:
    image: prom/prometheus:latest
    container_name: biblioteka_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - biblioteka_net

  grafana:
    image: grafana/grafana:latest
    container_name: biblioteka_grafana
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - biblioteka_net

networks:
  biblioteka_net:
    driver: bridge

volumes:
  pgdata: