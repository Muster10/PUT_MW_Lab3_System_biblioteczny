<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja - Biblioteka</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Logo.png" type="image/png">
</head>
<body>
    <div class="kontener-rejestracji">
        <h2>Zarejestruj się</h2>
        <form id="formularz-rejestracji">
            <!-- Max 6 znaków wymuszone przez HTML, zgodnie z ograniczeniem bazy danych -->
            <input type="text" id="login" placeholder="Login (max 6 znaków)" maxlength="6" required>
            <div class="haslo-kontener">
                <input type="password" id="haslo" placeholder="Hasło" required>
                <button type="button" id="pokaz-haslo" class="btn-oko">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5c0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </button>
            </div>
            <button type="submit" class="btn">Utwórz konto</button>
        </form>
        <p id="komunikat"></p>
        <br>
        <a href="index.html">Powrót do strony głównej</a>
    </div>
    <script src="rejestracja.js"></script>
</body>
</html>
