<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - Biblioteka Omnibus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Logo.png" type="image/png">
</head>
<body>
    <div class="kontener-rejestracji">
        <h2>Zaloguj się</h2>
        <form id="formularz-logowania">

            <input type="password" id="haslo" placeholder="Hasło" required>
            <button type="submit" class="btn">Zaloguj</button>
        </form>
        <p id="komunikat"></p>
        <br>
        <a href="rejestracja.html">Nie masz konta? Zarejestruj się</a>
        <br>
        <a href="index.html">Powrót do strony głównej</a>
    </div>
    <script src="logowanie.js"></script>
</body>
</html>
